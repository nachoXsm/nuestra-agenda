name: Pruebas

# Todo esto corre sin ningún servicio de afuera: ni Supabase, ni claves, ni red.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  esquema:
    name: Esquema y RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Postgres 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16
      - name: Correr las pruebas
        run: sudo PGBIN=/usr/lib/postgresql/16/bin ./supabase/tests/run.sh

  funciones:
    name: Funciones y librerías
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint
      - run: deno task check
      - run: deno task test
      - name: Las funciones de un archivo tienen que estar al día
        # Si alguien toca functions/ y no regenera, lo que se pega en Supabase
        # queda viejo sin que nadie se entere. De paso, el armador falla si dos
        # módulos declaran el mismo nombre: eso el pegue no lo perdona.
        run: node supabase/armar-funciones.mjs --revisar

  interfaz:
    name: La app en un navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright
        working-directory: pruebas
        run: |
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Correr las pruebas
        # Sin CHROMIUM, playwright usa el que acaba de bajar.
        run: node pruebas/app.test.mjs
