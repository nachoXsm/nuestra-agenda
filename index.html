<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>juntos</title>
<meta name="description" content="La agenda de la familia, el menú de la semana y lo que hay que hacer, en un solo lugar.">

<!-- El color de la barra del sistema. Arranca en claro, que es el tema por
     defecto, y lo actualiza estado.js cuando se cambia de tema. -->
<meta name="theme-color" id="color-barra" content="#f7f3ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="juntos">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192-v2.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192-v2.png">

<!-- Plus Jakarta Sans para todo, e Instrument Serif itálica solo para los
     saludos y los logros: una vez por pantalla como máximo, dice el manual. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- El tema se pinta antes de que aparezca nada, así no hay un parpadeo al
     abrir. El que manda es el elegido a mano; si nunca se eligió, claro. No se
     mira la preferencia del sistema a propósito: la app es de marfil, y quien
     la quiera oscura la cambia con el botón de la cabecera. -->
<script>
  (function () {
    var t = 'claro';
    try {
      var g = localStorage.getItem('ag_tema');
      if (g === 'claro' || g === 'oscuro') t = g;
    } catch (e) { /* localStorage bloqueado */ }
    document.documentElement.dataset.tema = t;
    var m = document.getElementById('color-barra');
    if (m) m.content = t === 'oscuro' ? '#111513' : '#f7f3ec';
  })();
</script>

<div id="app">
  <header class="cabecera oculto" id="cabecera">
    <h1 id="titulo">juntos</h1>
    <div id="acciones-cabecera"></div>
  </header>

  <main id="main">
    <div class="cargando"><span class="ruedita"></span> Abriendo…</div>
  </main>

  <!-- Los botones los arma main.js con los iconos de js/lib/iconos.js, para
       que el dibujo de cada icono viva en un solo lugar. -->
  <nav class="barra oculto" id="barra" aria-label="Secciones"></nav>
</div>

<div id="capas"></div>

<noscript>
  <div style="padding:48px 24px;text-align:center;font-family:system-ui;color:#1b211f">
    <h1 style="font-size:28px;letter-spacing:-1px;margin-bottom:12px">juntos</h1>
    <p>Esta app necesita JavaScript para funcionar.</p>
  </div>
</noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
