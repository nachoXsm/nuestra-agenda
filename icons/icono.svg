<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Icono de Nuestra Agenda: una hoja de calendario con dos marcas.
       Las dos marcas son las dos personas: la agenda es de los dos. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#6f5cff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#fondo)"/>

  <!-- la hoja -->
  <rect x="104" y="128" width="304" height="272" rx="34" fill="#ffffff" opacity="0.97"/>
  <!-- la banda de arriba -->
  <path d="M104 162a34 34 0 0 1 34-34h236a34 34 0 0 1 34 34v36H104z" fill="#3b2f7a"/>
  <!-- las anillas -->
  <rect x="164" y="92" width="26" height="62" rx="13" fill="#ffd166"/>
  <rect x="322" y="92" width="26" height="62" rx="13" fill="#ff9f68"/>

  <!-- los días -->
  <g fill="#c9cfe8">
    <circle cx="164" cy="256" r="17"/>
    <circle cx="256" cy="256" r="17"/>
    <circle cx="348" cy="256" r="17"/>
    <circle cx="164" cy="336" r="17"/>
    <circle cx="348" cy="336" r="17"/>
  </g>
  <!-- los dos días marcados: uno de cada uno -->
  <circle cx="256" cy="336" r="26" fill="#ff9f68"/>
  <circle cx="348" cy="256" r="26" fill="#8b7cff"/>
</svg>
